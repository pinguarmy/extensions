name: Help or problem report
description: Ask a question or report a problem with one of the extensions
body:
  - type: dropdown
    id: extension
    attributes:
      label: Extension
      options:
        - TubeNotes
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the page address if the problem happens on a specific site. Please do not paste personal data.
    validations:
      required: true
